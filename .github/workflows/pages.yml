name: Site

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "src/sudoku_vision/assets/**"
      - "tests/data/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Tests et construction du site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Installation
        working-directory: web
        run: npm ci

      - name: Tests (parité avec la version Python)
        working-directory: web
        run: npm test

      - name: Assemblage du site
        run: |
          cd web && npm run sync && cd ..
          mkdir _site
          cp -r web/index.html web/css web/js web/assets _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Mise en ligne
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
